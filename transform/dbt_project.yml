name: faultline
version: "0.1.0"
config-version: 2
profile: faultline

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: target

vars:
  # Which formula the marts compute. Weights and thresholds below must match
  # config/score_<version>.toml; tests/test_score_config.py checks that they do.
  score_formula_version: "v1"
  # Local lake folder, relative to this transform/ folder. CI points it at a downloaded copy.
  lake_dir: "../data/lake"
  config_dir: "../config"
  # Date the score is computed for. Empty means the date of the newest backfill snapshot.
  as_of: ""
  window_days: 90
  backfill_days: 183  # how far back the backfill job fetched (src/faultline/ingestion/backfill.py)
  dependency_depth_discount: 0.6
  weights:
    maintainer_activity: 20
    contributor_retention: 15
    responsiveness: 15
    pr_flow: 10
    release_recency: 10
    bus_factor: 10
    dependency_risk: 15
    open_vulnerabilities: 5
  # Smallest sample that makes a component meaningful (definitions.md, changelog 2026-11-02).
  min_prs_for_flow: 5
  min_items_for_responsiveness: 5
  min_prev_contributors: 3
  min_commits_for_bus_factor: 10
  insufficient_data_below: 3

models:
  faultline:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
