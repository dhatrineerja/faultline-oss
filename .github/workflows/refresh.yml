name: refresh

# Events API load every 30 minutes. Needs three repository secrets:
#   GH_API_TOKEN     personal access token (the built-in GITHUB_TOKEN allows only 1,000 calls an hour)
#   HF_TOKEN         Hugging Face write token
#   HF_DATASET_REPO  dataset id, for example yourname/faultline-lake
#   HEALTHCHECK_URL  optional: ping URL of the heartbeat check (healthchecks.io). A good run pings it;
#                    it alerts when no ping arrives in time, which catches runs that never start.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Never run two loads at once: they would merge into the same partitions.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[pipeline]"
      # Separate small steps so a failure names the exact secret that is wrong.
      - name: Check GH_API_TOKEN is set and accepted by GitHub
        env:
          T: ${{ secrets.GH_API_TOKEN }}
        run: |
          T=$(printf %s "$T" | tr -d '[:space:]')  # the code trims too; checks the cleaned value
          test -n "$T" || { echo "GH_API_TOKEN is empty or missing"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $T" https://api.github.com/rate_limit)
          test "$code" = 200 || { echo "GitHub answered $code"; exit 1; }
      - name: Check HF_TOKEN and HF_DATASET_REPO can reach the dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN is empty or missing"; exit 1; }
          test -n "$HF_DATASET_REPO" || { echo "HF_DATASET_REPO is empty or missing"; exit 1; }
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          info = api.dataset_info(os.environ['HF_DATASET_REPO'])
          print('dataset reachable; private =', info.private)
          "
      - name: Load events
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          # Retry a few times: state is saved only after data is stored, so a retry is safe.
          for attempt in 1 2 3; do
            python -m faultline.ingestion.events_api && exit 0
            echo "attempt $attempt failed" >&2
            sleep 60
          done
          exit 1
      # Heartbeat. A run that never starts sends nothing, so silence is what raises the alert.
      - name: Ping the heartbeat after a good run
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then echo "HEALTHCHECK_URL is not set; no heartbeat sent"; exit 0; fi
          # A bad URL must never fail the load itself, so a failed ping only warns.
          curl -fsS -m 20 --retry 3 "$HEALTHCHECK_URL" > /dev/null || echo "::warning::heartbeat ping failed; check HEALTHCHECK_URL"
      - name: Report a failed run to the heartbeat
        if: failure()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then curl -fsS -m 20 --retry 3 "$HEALTHCHECK_URL/fail" > /dev/null || true; fi
