name: stage1-checkpoint

# One-off measurement of the Stage 1 "7 straight days of runs" checkpoint.
# Runs on the morning of 9 November 2026 (09:00 India time; the 7 days end at 19:50 UTC on 8 November), appends the report to
# docs/stage-1-checkpoint.md and commits it. It only records the result: it does not
# change the criteria or close the checkpoint. Can also be started by hand from the Actions tab.
# Uses the same three repository secrets as the refresh workflow.
on:
  schedule:
    - cron: "30 3 9 11 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1-checkpoint
  cancel-in-progress: false

jobs:
  measure:
    # github.run_started_at is not available in a job condition (the first version skipped itself),
    # so only the schedule is checked here and the year is checked in the first step.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 9 11 *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip after 2026 (a yearly cron cannot name a year)
        id: guard
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'yes'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[pipeline]"
        if: steps.guard.outputs.run == 'yes'
      - name: Run the checkpoint report
        if: steps.guard.outputs.run == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          # The script exits 1 when a criterion fails; that is a result, not an error.
          set +e
          python ops/check_stage1.py > report.md
          echo "exit=$?" >&2
          set -e
          test -s report.md
      - name: Append the report to the checkpoint log
        if: steps.guard.outputs.run == 'yes'
        run: |
          {
            echo
            echo "### Measurement $(date -u +%Y-%m-%d), automatic run"
            echo
            # Drop the report's own title line; the heading above replaces it.
            tail -n +2 report.md
            echo
            echo "**Note.** Recorded automatically by the stage1-checkpoint workflow. Nothing was changed: the 6-hour criterion and the plan are as they were. What to do about the 6-hour rule is still to be decided with the owner."
          } >> docs/stage-1-checkpoint.md
      - name: Commit the log
        if: steps.guard.outputs.run == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stage-1-checkpoint.md
          git commit -m "Record the automatic Stage 1 checkpoint measurement"
          git push
